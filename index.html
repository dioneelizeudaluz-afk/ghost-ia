<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Ghost IA - Editor de código GitHub">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ghost IA">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <title>Ghost IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overflow-x: hidden;
            min-height: 100vh;
        }
        button { cursor: pointer; }
        input, textarea, select { outline: none; }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            pointer-events: none;
            animation: orbFloat 10s ease-in-out infinite;
        }
        .orb-1 { width: 300px; height: 300px; background: rgba(139, 92, 246, 0.25); top: -100px; left: -100px; }
        .orb-2 { width: 250px; height: 250px; background: rgba(124, 58, 237, 0.2); bottom: -50px; right: -50px; animation-delay: 5s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
        }

        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #8b5cf6;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            animation: particleUp linear infinite;
        }
        @keyframes particleUp {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #splash.hide { display: none; }
        .ghost-logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            font-weight: bold;
            margin-bottom: 20px;
            animation: logoPulse 2s infinite;
        }
        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); }
            50% { box-shadow: 0 0 80px rgba(139, 92, 246, 1); }
        }
        .ghost-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
        }
        .ghost-sub {
            font-size: 12px;
            color: #a78bfa;
            letter-spacing: 4px;
            animation: fadeInOut 2s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .loading-bar {
            width: 150px;
            height: 3px;
            background: #1a1a2e;
            margin-top: 30px;
            overflow: hidden;
            border-radius: 3px;
        }
        .loading-bar::after {
            content: '';
            display: block;
            width: 50%;
            height: 100%;
            background: #8b5cf6;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; position: relative; z-index: 10; }

        .header {
            background: rgba(10, 10, 15, 0.95);
            border-bottom: 1px solid #8b5cf6;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .btn {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 14px 20px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn-purple {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
        }
        .btn-green {
            background: #10b981;
            color: white;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        }
        .btn-ghost {
            background: transparent;
            border: 1px solid #8b5cf6;
            color: #a78bfa;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        }

        .repo-item {
            width: 100%;
            padding: 18px;
            background: rgba(19, 19, 32, 0.8);
            border: 1px solid #8b5cf6;
            color: white;
            text-align: left;
            font-size: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            clip-path: polygon(15px 0%, 100% 0%, calc(100% - 15px) 100%, 0% 100%);
            font-weight: 700;
            letter-spacing: 1px;
        }
        .repo-item:hover {
            background: rgba(139, 92, 246, 0.15);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.4);
        }
        .repo-item .lang {
            font-size: 11px;
            color: #6b7280;
            display: block;
            margin-top: 5px;
            font-weight: 400;
        }

        .file-item {
            width: 100%;
            padding: 12px 15px;
            background: rgba(19, 19, 32, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #a78bfa;
            text-align: left;
            font-size: 12px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: monospace;
            border-left: 2px solid #8b5cf6;
        }
        .file-item:hover {
            background: rgba(139, 92, 246, 0.15);
            transform: translateX(5px);
        }

        .input {
            width: 100%;
            padding: 14px;
            background: rgba(26, 26, 42, 0.9);
            border: 1px solid #8b5cf6;
            color: white;
            font-size: 15px;
            margin-bottom: 12px;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        }
        .input:focus {
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
        }
        .input::placeholder { color: #6b7280; }

        .card {
            background: rgba(19, 19, 32, 0.7);
            border: 1px solid #8b5cf6;
            padding: 20px;
            margin-bottom: 12px;
            backdrop-filter: blur(20px);
            clip-path: polygon(15px 0%, 100% 0%, calc(100% - 15px) 100%, 0% 100%);
        }

        .editor {
            width: 100%;
            height: 400px;
            background: rgba(19, 19, 32, 0.9);
            border: 1px solid #8b5cf6;
            color: #e5e7eb;
            font-family: monospace;
            font-size: 14px;
            padding: 14px;
            margin-bottom: 12px;
            resize: vertical;
        }

        .code-area {
            width: 100%;
            min-height: 150px;
            background: rgba(26, 26, 42, 0.9);
            border: 1px solid #8b5cf6;
            color: white;
            font-size: 12px;
            font-family: monospace;
            padding: 14px;
            margin-bottom: 12px;
            resize: vertical;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: bold;
            z-index: 3000;
            animation: toastIn 0.3s;
            clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
        }
        @keyframes toastIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-success { background: #10b981; color: white; }
        .toast-error { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="splash">
        <div class="ghost-logo">G</div>
        <div class="ghost-title">GHOST IA</div>
        <div class="ghost-sub">SEU CÓDIGO. SEU EDITOR.</div>
        <div class="loading-bar"></div>
    </div>

    <div id="app"></div>

    <script>
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 10 + 8) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            document.body.appendChild(p);
        }

        setTimeout(() => { document.getElementById('splash').classList.add('hide'); }, 3000);

        let token = localStorage.getItem('ghost_token') || '';
        let repos = [];
        let selectedRepo = null;
        let files = [];

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + (type === 'success' ? 'toast-success' : 'toast-error');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="container" style="text-align:center;padding-top:30px;">
                    <h1 class="title" style="font-size:32px;margin-bottom:10px;">GHOST IA</h1>
                    <p style="color:#a78bfa;margin-bottom:30px;letter-spacing:3px;font-size:12px;">EDITOR DE CÓDIGO</p>
                    <div class="card">
                        <input id="tokenInput" type="password" placeholder="TOKEN DO GITHUB" value="${token}" class="input">
                        <button onclick="connect()" class="btn btn-purple" style="width:100%;">CONECTAR</button>
                    </div>
                </div>
            `;
        }

        async function connect() {
            token = document.getElementById('tokenInput').value;
            const res = await fetch('https://api.github.com/user', { headers: { 'Authorization': 'token ' + token } });
            if (res.ok) {
                localStorage.setItem('ghost_token', token);
                showToast('CONECTADO!', 'success');
                showRepos();
            } else {
                showToast('TOKEN INVÁLIDO', 'error');
            }
        }

        async function showRepos() {
            const res = await fetch('https://api.github.com/user/repos?sort=updated&per_page=50', { headers: { 'Authorization': 'token ' + token } });
            repos = await res.json();
            document.getElementById('app').innerHTML = `
                <div class="header"><span class="title">GHOST IA</span><button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:10px;">SAIR</button></div>
                <div class="container">
                    <h2 style="color:#8b5cf6;font-size:16px;margin-bottom:20px;">REPOSITÓRIOS [${repos.length}]</h2>
                    <div id="repoList"></div>
                </div>
            `;
            document.getElementById('repoList').innerHTML = repos.map(repo => `
                <button class="repo-item" onclick="openRepo('${repo.full_name}','${repo.default_branch}')">⬡ ${repo.name}<span class="lang">${repo.language || 'SEM LINGUAGEM'}</span></button>
            `).join('');
        }

        async function openRepo(fullName, branch) {
            selectedRepo = { full_name: fullName, default_branch: branch };
            const res = await fetch(`https://api.github.com/repos/${fullName}/git/trees/${branch}?recursive=1`, { headers: { 'Authorization': 'token ' + token } });
            const data = await res.json();
            files = data.tree.filter(item => item.type === 'blob');
            document.getElementById('app').innerHTML = `
                <div class="header"><span class="title">GHOST IA</span><button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:10px;">SAIR</button></div>
                <div class="container">
                    <button onclick="showRepos()" class="btn btn-ghost" style="margin-bottom:15px;font-size:10px;">← VOLTAR</button>
                    <h2 style="color:#8b5cf6;font-size:14px;margin-bottom:10px;">${fullName}</h2>
                    <button onclick="showApplyCode()" class="btn btn-green" style="width:100%;margin-bottom:15px;font-size:11px;">APLICAR CÓDIGO</button>
                    <h3 style="color:#a78bfa;font-size:12px;margin-bottom:10px;">ARQUIVOS [${files.length}]</h3>
                    <div id="fileList"></div>
                </div>
            `;
            document.getElementById('fileList').innerHTML = files.slice(0, 100).map(file => `<button class="file-item" onclick="openFile('${file.path}')">${file.path}</button>`).join('');
        }

        async function openFile(path) {
            const res = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, { headers: { 'Authorization': 'token ' + token } });
            const data = await res.json();
            const content = atob(data.content.replace(/\n/g, ''));
            document.getElementById('app').innerHTML = `
                <div class="header"><span class="title">GHOST IA</span><button onclick="saveFile('${path}')" class="btn btn-green" style="padding:8px 15px;font-size:10px;">SALVAR</button></div>
                <div class="container">
                    <button onclick="openRepo('${selectedRepo.full_name}','${selectedRepo.default_branch}')" class="btn btn-ghost" style="margin-bottom:10px;font-size:10px;">← VOLTAR</button>
                    <h2 class="title" style="font-size:12px;margin-bottom:10px;">${path}</h2>
                    <textarea id="editor" class="editor">${content}</textarea>
                    <input id="commitMsg" type="text" value="update: ${path}" class="input">
                </div>
            `;
        }

        async function saveFile(path) {
            const content = document.getElementById('editor').value;
            const message = document.getElementById('commitMsg').value;
            const getRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, { headers: { 'Authorization': 'token ' + token } });
            const getData = await getRes.json();
            const sha = getData.sha;
            const updateRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                method: 'PUT', headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, content: btoa(unescape(encodeURIComponent(content))), sha: sha })
            });
            if (updateRes.ok) { showToast('ARQUIVO SALVO!', 'success'); openRepo(selectedRepo.full_name, selectedRepo.default_branch); }
            else { const err = await updateRes.json(); showToast('ERRO: ' + err.message, 'error'); }
        }

        function showApplyCode() {
            document.getElementById('app').innerHTML = `
                <div class="header"><span class="title">GHOST IA</span><button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:10px;">SAIR</button></div>
                <div class="container">
                    <button onclick="openRepo('${selectedRepo.full_name}','${selectedRepo.default_branch}')" class="btn btn-ghost" style="margin-bottom:15px;font-size:10px;">← VOLTAR</button>
                    <h2 class="title" style="font-size:14px;margin-bottom:15px;">APLICAR CÓDIGO</h2>
                    <textarea id="codeInput" class="code-area" placeholder='{"summary":"...","files":[{"path":"...","action":"create","newContent":"..."}]}'></textarea>
                    <button onclick="applyCode()" class="btn btn-green" style="width:100%;font-size:11px;">APLICAR AGORA</button>
                </div>
            `;
        }

        async function applyCode() {
            const codeText = document.getElementById('codeInput').value;
            try {
                let parsed;
                try { parsed = JSON.parse(codeText); } catch (e) {
                    let cleaned = codeText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const start = cleaned.indexOf('{'); const end = cleaned.lastIndexOf('}');
                    if (start !== -1 && end !== -1) { cleaned = cleaned.substring(start, end + 1); parsed = JSON.parse(cleaned); }
                }
                if (parsed && parsed.files) {
                    for (const file of parsed.files) {
                        const path = file.path; const content = file.newContent || '';
                        const checkRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, { headers: { 'Authorization': 'token ' + token } });
                        let sha = null;
                        if (checkRes.ok) { const fd = await checkRes.json(); sha = fd.sha; }
                        const body = { message: parsed.summary || 'update', content: btoa(unescape(encodeURIComponent(content))), branch: selectedRepo.default_branch };
                        if (sha) body.sha = sha;
                        const updateRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                            method: 'PUT', headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                        });
                        if (updateRes.ok) { showToast('✅ ' + path, 'success'); } else { const err = await updateRes.json(); showToast('❌ ' + err.message, 'error'); }
                    }
                    setTimeout(() => { openRepo(selectedRepo.full_name, selectedRepo.default_branch); }, 1500);
                } else { showToast('JSON INVÁLIDO', 'error'); }
            } catch (err) { showToast('ERRO', 'error'); }
        }

        function logout() { localStorage.clear(); token = ''; showLogin(); }

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); }); }

        if (token) { showRepos(); } else { showLogin(); }
    </script>
</body>
    </html>
