<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="Ghost IA - Editor de código GitHub">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ghost IA">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="apple-touch-icon" href="/icon.png">
    <title>Ghost IA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overflow-x: hidden;
        }
        button { cursor: pointer; }
        input, textarea { outline: none; }

        /* Animated background particles */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: #8b5cf6;
            animation: float linear infinite;
            opacity: 0.3;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            20% { opacity: 0.3; }
            100% { transform: translateY(-20vh) scale(1); opacity: 0; }
        }

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #splash.hide { display: none; }
        .ghost-logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(139, 92, 246, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 60px rgba(139, 92, 246, 0.9); transform: scale(1.05); }
        }
        .ghost-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .ghost-sub {
            font-size: 13px;
            color: #9ca3af;
            animation: fadeInOut 3s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 15px; 
            position: relative;
            z-index: 10;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-purple { 
            background: linear-gradient(135deg, #8b5cf6, #7c3aed); 
            color: white;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }
        .btn-purple:hover {
            box-shadow: 0 4px 30px rgba(139, 92, 246, 0.6);
            transform: translateY(-2px);
        }
        .btn-green { background: #10b981; color: white; }
        .btn-ghost { 
            background: rgba(139, 92, 246, 0.1); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            color: #a78bfa; 
            backdrop-filter: blur(10px);
        }
        .card { 
            background: rgba(19, 19, 32, 0.8); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .card:hover {
            border-color: rgba(139, 92, 246, 0.6);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.2);
        }
        .input {
            width: 100%;
            padding: 12px;
            background: rgba(26, 26, 42, 0.8);
            border: 1px solid #8b5cf6;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        .repo-item {
            width: 100%;
            padding: 15px;
            background: rgba(19, 19, 32, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            color: white;
            text-align: left;
            font-size: 16px;
            margin-bottom: 8px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .repo-item:hover { 
            border-color: #8b5cf6; 
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
            transform: translateX(5px);
        }
        .file-item {
            width: 100%;
            padding: 12px;
            background: rgba(19, 19, 32, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 6px;
            color: #a78bfa;
            text-align: left;
            font-size: 13px;
            margin-bottom: 5px;
            font-family: monospace;
            transition: all 0.2s;
        }
        .file-item:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }
        .editor {
            width: 100%;
            height: 400px;
            background: rgba(19, 19, 32, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: #e5e7eb;
            font-family: monospace;
            font-size: 14px;
            padding: 12px;
            margin-bottom: 10px;
            resize: vertical;
        }
        .code-area {
            width: 100%;
            min-height: 150px;
            background: rgba(26, 26, 42, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 12px;
            font-family: monospace;
            padding: 12px;
            margin-bottom: 10px;
            resize: vertical;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            z-index: 3000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .toast-success { background: #10b981; color: white; }
        .toast-error { background: #ef4444; color: white; }
        .header {
            background: rgba(19, 19, 32, 0.9);
            border-bottom: 1px solid rgba(139, 92, 246, 0.3);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .title {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>
    <div id="splash">
        <div class="ghost-logo">G</div>
        <div class="ghost-title">GHOST IA</div>
        <div class="ghost-sub">Seu código. Seu editor.</div>
    </div>
    <div id="app"></div>
    <script>
        // Create floating particles
        function createParticles() {
            const container = document.getElementById('bgAnimation');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.width = Math.random() * 4 + 2 + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDuration = Math.random() * 15 + 10 + 's';
                particle.style.animationDelay = Math.random() * 10 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        setTimeout(() => {
            document.getElementById('splash').classList.add('hide');
        }, 2500);

        let token = localStorage.getItem('ghost_token') || '';
        let repos = [];
        let selectedRepo = null;
        let files = [];

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + (type === 'success' ? 'toast-success' : 'toast-error');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="container" style="text-align:center;padding-top:40px;">
                    <h1 class="title" style="font-size:32px;margin-bottom:10px;">GHOST IA</h1>
                    <p style="color:#9ca3af;margin-bottom:30px;">Editor de código GitHub</p>
                    <div class="card">
                        <input id="tokenInput" type="password" placeholder="ghp_..." value="${token}" class="input">
                        <button onclick="connect()" class="btn btn-purple" style="width:100%;">Conectar GitHub</button>
                    </div>
                </div>
            `;
        }

        async function connect() {
            token = document.getElementById('tokenInput').value;
            const res = await fetch('https://api.github.com/user', {
                headers: { 'Authorization': 'token ' + token }
            });
            if (res.ok) {
                localStorage.setItem('ghost_token', token);
                showToast('Conectado!', 'success');
                showRepos();
            } else {
                showToast('Token inválido', 'error');
            }
        }

        async function showRepos() {
            const res = await fetch('https://api.github.com/user/repos?sort=updated&per_page=50', {
                headers: { 'Authorization': 'token ' + token }
            });
            repos = await res.json();
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="title">GHOST IA</span>
                    <button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:13px;">Sair</button>
                </div>
                <div class="container">
                    <h2 style="color:white;margin-bottom:15px;">Repositórios (${repos.length})</h2>
                    <div id="repoList"></div>
                </div>
            `;
            document.getElementById('repoList').innerHTML = repos.map(repo => `
                <button class="repo-item" onclick="openRepo('${repo.full_name}','${repo.default_branch}')">
                    ${repo.name}
                    <span style="color:#6b7280;font-size:12px;display:block;margin-top:5px;">${repo.language || ''}</span>
                </button>
            `).join('');
        }

        async function openRepo(fullName, branch) {
            selectedRepo = { full_name: fullName, default_branch: branch };
            const res = await fetch(`https://api.github.com/repos/${fullName}/git/trees/${branch}?recursive=1`, {
                headers: { 'Authorization': 'token ' + token }
            });
            const data = await res.json();
            files = data.tree.filter(item => item.type === 'blob');
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="title">GHOST IA</span>
                    <button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:13px;">Sair</button>
                </div>
                <div class="container">
                    <button onclick="showRepos()" class="btn btn-ghost" style="margin-bottom:15px;">← Voltar</button>
                    <h2 style="color:white;margin-bottom:10px;">${fullName}</h2>
                    <button onclick="showApplyCode()" class="btn btn-green" style="width:100%;margin-bottom:15px;">APLICAR CÓDIGO</button>
                    <h3 style="color:#a78bfa;font-size:14px;margin-bottom:10px;">Arquivos (${files.length})</h3>
                    <div id="fileList"></div>
                </div>
            `;
            document.getElementById('fileList').innerHTML = files.slice(0, 100).map(file => `
                <button class="file-item" onclick="openFile('${file.path}')">📄 ${file.path}</button>
            `).join('');
        }

        async function openFile(path) {
            const res = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                headers: { 'Authorization': 'token ' + token }
            });
            const data = await res.json();
            const content = atob(data.content.replace(/\n/g, ''));
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="title">GHOST IA</span>
                    <button onclick="saveFile('${path}')" class="btn btn-green" style="padding:8px 15px;font-size:13px;">SALVAR</button>
                </div>
                <div class="container">
                    <button onclick="openRepo('${selectedRepo.full_name}','${selectedRepo.default_branch}')" class="btn btn-ghost" style="margin-bottom:10px;">← Voltar</button>
                    <h2 class="title" style="font-size:14px;margin-bottom:10px;">${path}</h2>
                    <textarea id="editor" class="editor">${content}</textarea>
                    <input id="commitMsg" type="text" value="update: ${path}" class="input">
                </div>
            `;
        }

        async function saveFile(path) {
            const content = document.getElementById('editor').value;
            const message = document.getElementById('commitMsg').value;
            const getRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                headers: { 'Authorization': 'token ' + token }
            });
            const getData = await getRes.json();
            const sha = getData.sha;
            const updateRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    content: btoa(unescape(encodeURIComponent(content))),
                    sha: sha
                })
            });
            if (updateRes.ok) {
                showToast('Arquivo salvo!', 'success');
                openRepo(selectedRepo.full_name, selectedRepo.default_branch);
            } else {
                const err = await updateRes.json();
                showToast('Erro: ' + err.message, 'error');
            }
        }

        function showApplyCode() {
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="title">GHOST IA</span>
                    <button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:13px;">Sair</button>
                </div>
                <div class="container">
                    <button onclick="openRepo('${selectedRepo.full_name}','${selectedRepo.default_branch}')" class="btn btn-ghost" style="margin-bottom:15px;">← Voltar</button>
                    <h2 class="title" style="margin-bottom:15px;">Aplicar Código</h2>
                    <textarea id="codeInput" class="code-area" placeholder='{"summary":"Mudar fundo","files":[{"path":"src/index.css","action":"modify","originalContent":"","newContent":"body { background: #8b5cf6; }"}]}'></textarea>
                    <button onclick="applyCode()" class="btn btn-green" style="width:100%;">APLICAR AGORA</button>
                </div>
            `;
        }

        async function applyCode() {
            const codeText = document.getElementById('codeInput').value;
            try {
                let parsed;
                try {
                    parsed = JSON.parse(codeText);
                } catch (e) {
                    let cleaned = codeText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const start = cleaned.indexOf('{');
                    const end = cleaned.lastIndexOf('}');
                    if (start !== -1 && end !== -1) {
                        cleaned = cleaned.substring(start, end + 1);
                        parsed = JSON.parse(cleaned);
                    }
                }
                
                if (parsed && parsed.files && Array.isArray(parsed.files)) {
                    for (const file of parsed.files) {
                        const path = file.path;
                        const content = file.newContent || '';
                        
                        const checkRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                            headers: { 'Authorization': 'token ' + token }
                        });
                        
                        let sha = null;
                        if (checkRes.ok) {
                            const fileData = await checkRes.json();
                            sha = fileData.sha;
                        }
                        
                        const body = {
                            message: parsed.summary || 'update: ' + path,
                            content: btoa(unescape(encodeURIComponent(content))),
                            branch: selectedRepo.default_branch
                        };
                        if (sha) body.sha = sha;
                        
                        const updateRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                            method: 'PUT',
                            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });
                        
                        if (updateRes.ok) {
                            showToast('✅ ' + path + ' criado/atualizado!', 'success');
                        } else {
                            const err = await updateRes.json();
                            showToast('❌ ' + path + ': ' + err.message, 'error');
                        }
                    }
                    
                    setTimeout(() => {
                        openRepo(selectedRepo.full_name, selectedRepo.default_branch);
                    }, 1500);
                } else {
                    showToast('JSON inválido', 'error');
                }
            } catch (err) {
                showToast('Erro ao processar JSON', 'error');
            }
        }

        function logout() {
            localStorage.clear();
            token = '';
            showLogin();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        if (token) {
            showRepos();
        } else {
            showLogin();
        }
    </script>
</body>
    </html>
