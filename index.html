<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Ghost IA</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Grid background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(139, 92, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* Glow orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 1;
            pointer-events: none;
            animation: orbFloat 10s ease-in-out infinite;
        }
        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.3);
            top: -100px;
            left: -100px;
        }
        .orb-2 {
            width: 250px;
            height: 250px;
            background: rgba(124, 58, 237, 0.2);
            bottom: -50px;
            right: -50px;
            animation-delay: 5s;
        }
        .orb-3 {
            width: 200px;
            height: 200px;
            background: rgba(167, 139, 250, 0.15);
            top: 50%;
            left: 50%;
            animation-delay: 3s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.1); }
            50% { transform: translate(-20px, 30px) scale(0.9); }
            75% { transform: translate(10px, -10px) scale(1.05); }
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #8b5cf6;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            animation: particleUp linear infinite;
        }
        @keyframes particleUp {
            0% { transform: translateY(100vh); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }

        /* Splash */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #splash.hide { display: none; }
        .ghost-logo {
            width: 100px;
            height: 100px;
            border-radius: 25px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 20px;
            position: relative;
            animation: logoPulse 2s ease-in-out infinite;
        }
        .ghost-logo::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 28px;
            background: linear-gradient(135deg, #8b5cf6, transparent, #7c3aed);
            z-index: -1;
            animation: borderSpin 3s linear infinite;
        }
        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); }
            50% { box-shadow: 0 0 80px rgba(139, 92, 246, 1); }
        }
        @keyframes borderSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .ghost-title {
            font-size: 30px;
            font-weight: bold;
            background: linear-gradient(135deg, #8b5cf6, #a78bfa, #8b5cf6);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .ghost-sub {
            font-size: 13px;
            color: #a78bfa;
            letter-spacing: 2px;
            animation: fadeInOut 2s infinite;
        }
        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .loading-bar {
            width: 150px;
            height: 2px;
            background: #1a1a2e;
            border-radius: 2px;
            margin-top: 30px;
            overflow: hidden;
        }
        .loading-bar::after {
            content: '';
            display: block;
            width: 50%;
            height: 100%;
            background: #8b5cf6;
            animation: loading 1.5s ease-in-out infinite;
        }
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }

        /* UI */
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 15px; 
            position: relative;
            z-index: 10;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .btn-purple { 
            background: linear-gradient(135deg, #8b5cf6, #7c3aed); 
            color: white;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
        }
        .btn-purple::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        .btn-green { background: #10b981; color: white; }
        .btn-ghost { 
            background: rgba(139, 92, 246, 0.1); 
            border: 1px solid rgba(139, 92, 246, 0.4); 
            color: #a78bfa; 
            backdrop-filter: blur(10px);
        }
        .card { 
            background: rgba(19, 19, 32, 0.7); 
            border: 1px solid rgba(139, 92, 246, 0.3); 
            border-radius: 14px; 
            padding: 20px; 
            margin-bottom: 12px;
            backdrop-filter: blur(20px);
            transition: all 0.3s;
        }
        .card:hover {
            border-color: rgba(139, 92, 246, 0.7);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.3);
        }
        .input {
            width: 100%;
            padding: 14px;
            background: rgba(26, 26, 42, 0.8);
            border: 1px solid #8b5cf6;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        .input:focus {
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
            border-color: #a78bfa;
        }
        .repo-item {
            width: 100%;
            padding: 16px;
            background: rgba(19, 19, 32, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 12px;
            color: white;
            text-align: left;
            font-size: 16px;
            margin-bottom: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .repo-item:hover { 
            border-color: #8b5cf6; 
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
            transform: translateY(-3px);
        }
        .file-item {
            width: 100%;
            padding: 12px;
            background: rgba(19, 19, 32, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 8px;
            color: #a78bfa;
            text-align: left;
            font-size: 13px;
            margin-bottom: 6px;
            font-family: monospace;
            transition: all 0.2s;
        }
        .file-item:hover {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.15);
            transform: translateX(5px);
        }
        .editor {
            width: 100%;
            height: 400px;
            background: rgba(19, 19, 32, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 10px;
            color: #e5e7eb;
            font-family: monospace;
            font-size: 14px;
            padding: 14px;
            margin-bottom: 12px;
            resize: vertical;
        }
        .code-area {
            width: 100%;
            min-height: 150px;
            background: rgba(26, 26, 42, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 12px;
            font-family: monospace;
            padding: 14px;
            margin-bottom: 12px;
            resize: vertical;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 3000;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            animation: toastIn 0.3s ease;
        }
        @keyframes toastIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-success { background: #10b981; color: white; }
        .toast-error { background: #ef4444; color: white; }
        .header {
            background: rgba(10, 10, 15, 0.9);
            border-bottom: 1px solid rgba(139, 92, 246, 0.4);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }
        .title {
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div id="splash">
        <div class="ghost-logo">G</div>
        <div class="ghost-title">GHOST IA</div>
        <div class="ghost-sub">SEU CÓDIGO. SEU EDITOR.</div>
        <div class="loading-bar"></div>
    </div>

    <div id="app"></div>

    <script>
        // Create particles
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (Math.random() * 10 + 8) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            p.style.opacity = Math.random() * 0.5 + 0.2;
            document.body.appendChild(p);
        }

        setTimeout(() => {
            document.getElementById('splash').classList.add('hide');
        }, 3000);

        let token = localStorage.getItem('ghost_token') || '';
        let repos = [];
        let selectedRepo = null;
        let files = [];

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast ' + (type === 'success' ? 'toast-success' : 'toast-error');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="container" style="text-align:center;padding-top:30px;">
                    <h1 class="title" style="font-size:34px;margin-bottom:10px;">GHOST IA</h1>
                    <p style="color:#a78bfa;margin-bottom:30px;letter-spacing:1px;">EDITOR DE CÓDIGO</p>
                    <div class="card">
                        <input id="tokenInput" type="password" placeholder="ghp_..." value="${token}" class="input">
                        <button onclick="connect()" class="btn btn-purple" style="width:100%;">CONECTAR GITHUB</button>
                    </div>
                </div>
            `;
        }

        async function connect() {
            token = document.getElementById('tokenInput').value;
            const res = await fetch('https://api.github.com/user', {
                headers: { 'Authorization': 'token ' + token }
            });
            if (res.ok) {
                localStorage.setItem('ghost_token', token);
                showToast('CONECTADO!', 'success');
                showRepos();
            } else {
                showToast('TOKEN INVÁLIDO', 'error');
            }
        }

        async function showRepos() {
            const res = await fetch('https://api.github.com/user/repos?sort=updated&per_page=50', {
                headers: { 'Authorization': 'token ' + token }
            });
            repos = await res.json();
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="title">GHOST IA</span>
                    <button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:13px;">SAIR</button>
                </div>
                <div class="container">
                    <h2 style="color:white;margin-bottom:15px;">REPOSITÓRIOS (${repos.length})</h2>
                    <div id="repoList"></div>
                </div>
            `;
            document.getElementById('repoList').innerHTML = repos.map(repo => `
                <button class="repo-item" onclick="openRepo('${repo.full_name}','${repo.default_branch}')">
                    ${repo.name}
                    <span style="color:#6b7280;font-size:12px;display:block;margin-top:5px;">${repo.language || ''}</span>
                </button>
            `).join('');
        }

        async function openRepo(fullName, branch) {
            selectedRepo = { full_name: fullName, default_branch: branch };
            const res = await fetch(`https://api.github.com/repos/${fullName}/git/trees/${branch}?recursive=1`, {
                headers: { 'Authorization': 'token ' + token }
            });
            const data = await res.json();
            files = data.tree.filter(item => item.type === 'blob');
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="title">GHOST IA</span>
                    <button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:13px;">SAIR</button>
                </div>
                <div class="container">
                    <button onclick="showRepos()" class="btn btn-ghost" style="margin-bottom:15px;">← VOLTAR</button>
                    <h2 style="color:white;margin-bottom:10px;">${fullName}</h2>
                    <button onclick="showApplyCode()" class="btn btn-green" style="width:100%;margin-bottom:15px;">APLICAR CÓDIGO</button>
                    <h3 style="color:#a78bfa;font-size:14px;margin-bottom:10px;">ARQUIVOS (${files.length})</h3>
                    <div id="fileList"></div>
                </div>
            `;
            document.getElementById('fileList').innerHTML = files.slice(0, 100).map(file => `
                <button class="file-item" onclick="openFile('${file.path}')">📄 ${file.path}</button>
            `).join('');
        }

        async function openFile(path) {
            const res = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                headers: { 'Authorization': 'token ' + token }
            });
            const data = await res.json();
            const content = atob(data.content.replace(/\n/g, ''));
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="title">GHOST IA</span>
                    <button onclick="saveFile('${path}')" class="btn btn-green" style="padding:8px 15px;font-size:13px;">SALVAR</button>
                </div>
                <div class="container">
                    <button onclick="openRepo('${selectedRepo.full_name}','${selectedRepo.default_branch}')" class="btn btn-ghost" style="margin-bottom:10px;">← VOLTAR</button>
                    <h2 class="title" style="font-size:14px;margin-bottom:10px;">${path}</h2>
                    <textarea id="editor" class="editor">${content}</textarea>
                    <input id="commitMsg" type="text" value="update: ${path}" class="input">
                </div>
            `;
        }

        async function saveFile(path) {
            const content = document.getElementById('editor').value;
            const message = document.getElementById('commitMsg').value;
            const getRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                headers: { 'Authorization': 'token ' + token }
            });
            const getData = await getRes.json();
            const sha = getData.sha;
            const updateRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, content: btoa(unescape(encodeURIComponent(content))), sha: sha })
            });
            if (updateRes.ok) {
                showToast('ARQUIVO SALVO!', 'success');
                openRepo(selectedRepo.full_name, selectedRepo.default_branch);
            } else {
                const err = await updateRes.json();
                showToast('ERRO: ' + err.message, 'error');
            }
        }

        function showApplyCode() {
            document.getElementById('app').innerHTML = `
                <div class="header">
                    <span class="title">GHOST IA</span>
                    <button onclick="logout()" class="btn btn-ghost" style="padding:8px 15px;font-size:13px;">SAIR</button>
                </div>
                <div class="container">
                    <button onclick="openRepo('${selectedRepo.full_name}','${selectedRepo.default_branch}')" class="btn btn-ghost" style="margin-bottom:15px;">← VOLTAR</button>
                    <h2 class="title" style="margin-bottom:15px;">APLICAR CÓDIGO</h2>
                    <textarea id="codeInput" class="code-area" placeholder='{"summary":"Mudar fundo","files":[{"path":"src/index.css","action":"modify","originalContent":"","newContent":"body { background: #8b5cf6; }"}]}'></textarea>
                    <button onclick="applyCode()" class="btn btn-green" style="width:100%;">APLICAR AGORA</button>
                </div>
            `;
        }

        async function applyCode() {
            const codeText = document.getElementById('codeInput').value;
            try {
                let parsed;
                try {
                    parsed = JSON.parse(codeText);
                } catch (e) {
                    let cleaned = codeText.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const start = cleaned.indexOf('{');
                    const end = cleaned.lastIndexOf('}');
                    if (start !== -1 && end !== -1) {
                        cleaned = cleaned.substring(start, end + 1);
                        parsed = JSON.parse(cleaned);
                    }
                }
                if (parsed && parsed.files && Array.isArray(parsed.files)) {
                    for (const file of parsed.files) {
                        const path = file.path;
                        const content = file.newContent || '';
                        const checkRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                            headers: { 'Authorization': 'token ' + token }
                        });
                        let sha = null;
                        if (checkRes.ok) {
                            const fileData = await checkRes.json();
                            sha = fileData.sha;
                        }
                        const body = { message: parsed.summary || 'update: ' + path, content: btoa(unescape(encodeURIComponent(content))), branch: selectedRepo.default_branch };
                        if (sha) body.sha = sha;
                        const updateRes = await fetch(`https://api.github.com/repos/${selectedRepo.full_name}/contents/${path}`, {
                            method: 'PUT',
                            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });
                        if (updateRes.ok) {
                            showToast('✅ ' + path + ' ATUALIZADO!', 'success');
                        } else {
                            const err = await updateRes.json();
                            showToast('❌ ' + path + ': ' + err.message, 'error');
                        }
                    }
                    setTimeout(() => { openRepo(selectedRepo.full_name, selectedRepo.default_branch); }, 1500);
                } else {
                    showToast('JSON INVÁLIDO', 'error');
                }
            } catch (err) {
                showToast('ERRO AO PROCESSAR', 'error');
            }
        }

        function logout() {
            localStorage.clear();
            token = '';
            showLogin();
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        if (token) { showRepos(); } else { showLogin(); }
    </script>
</body>
    </html>
